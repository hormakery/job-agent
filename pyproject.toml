[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-agent"
version = "0.1.0"
description = "Autonomous 4-Agent Job Application & Interview Coordinator powered by Google Gemini, LangGraph, Local ATS Checker, and Next.js"
readme = "prd.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "google-genai>=1.0.0",
    "langgraph>=0.2.0",
    "gspread>=6.1.0",
    "google-api-python-client>=2.140.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
    "python-telegram-bot>=21.5",
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "markdown>=3.7",
    "fpdf2>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/job_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

